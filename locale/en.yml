linkrobins-swoop:
  admin:
    key_label: Mail key
    key_help: >
      Paste the key from your Link Robins dashboard. Your forum's account
      emails then go out through us over HTTPS, so a host that blocks SMTP
      ports stops mattering. Saving checks the key straight away.
    test_button: Send me a test email
    test_sending: Sending…
    test_sent: "Sent to {email}. If it does not arrive within a minute or two, check spam before changing anything."
    test_failed: "Could not send: {error}"
    test_help: >
      Sends one real email to your own address, so you find out the whole path
      works before a new member does. It counts against your monthly allowance.
    service_url_label: Service address
    service_url_help: >
      Where the key is checked and messages are handed over. Leave this alone
      unless you have been given a different address; it should look like
      https://linkrobins.com, with no path after the host.
    connected: Connected. Account emails are going out through Swoop.
    not_connected: >
      Not connected. Account emails are still using this forum's own mail
      settings.
    last_error: "Last answer from the service: {error}"
    scope_note: >
      Swoop currently carries the three account emails: confirm your account,
      reset your password, and confirm a new address. Notifications and
      digests still use your own mail settings.
